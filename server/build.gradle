plugins {
  id 'application'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

application {
  mainClass = 'io.github.Plants_Vs_Zombies_2.server.ServerLauncher'
}

dependencies {
  implementation project(':core')
  testImplementation platform('org.junit:junit-bom:5.11.4')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
}

tasks.named('run', JavaExec) {
  ['pvz.server.host', 'pvz.server.port', 'pvz.server.users.database',
      'pvz.server.invitation.expiration.seconds',
      'pvz.server.multiplayer.tick.rate',
      'pvz.server.multiplayer.match.duration.seconds',
      'pvz.server.multiplayer.reaction.cooldown.millis'].each { propertyName ->
    String value = System.getProperty(propertyName)
    if (value != null) {
      systemProperty propertyName, value
    }
  }
}

eclipse.project.name = appName + '-server'
