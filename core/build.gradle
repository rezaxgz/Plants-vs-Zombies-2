[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.github.raeleus.TenPatch:tenpatch:$tenPatchVersion"
  implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  implementation 'com.github.pizpizi:pvz-skin:v0.1.0'
  implementation 'com.github.raeleus.TenPatch:tenpatch:5.2.3'
  implementation 'com.github.pizpizi:libPVZ:v0.1.3'
  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('selfTest', JavaExec) {
  group = 'verification'
  description = 'Runs dependency-free deterministic project checks.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.Plants_Vs_Zombies_2.model.validation.ProjectSelfTest'
}
